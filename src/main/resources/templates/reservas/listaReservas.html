<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Reservas | Hotel Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-calendar-event"></i>
            Gestión de Reservas
        </h2>

        <div>

            <a th:href="@{/dashboard}" class="btn btn-secondary me-2">
                <i class="bi bi-house-door-fill"></i>
                Inicio
            </a>

            <a th:href="@{/reservas/nueva}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i>
                Nueva Reserva
            </a>

        </div>

    </div>
    <form th:action="@{/reservas}"
          method="get"
          class="row mb-4">

        <div class="col-md-6">

            <input type="text"
                   name="buscar"
                   th:value="${buscar}"
                   class="form-control"
                   placeholder="Buscar por huésped o número de habitación">

        </div>

        <div class="col-md-3">

            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-search"></i>
                Buscar

            </button>

            <a th:href="@{/reservas}"
               class="btn btn-secondary">

                Limpiar

            </a>

        </div>

    </form>
    <table class="table table-bordered table-hover shadow">

        <thead class="table-primary">

        <tr>

            <th>ID</th>
            <th>Huésped</th>
            <th>Habitación</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Total</th>
            <th>Estado</th>
            <th width="180">Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="r : ${reservas}">

            <td th:text="${r.id}"></td>

            <td th:text="${r.huesped.nombres + ' ' + r.huesped.apellidos}"></td>

            <td th:text="${r.habitacion.numero}"></td>

            <td th:text="${r.fechaEntrada}"></td>

            <td th:text="${r.fechaSalida}"></td>

            <td th:text="${r.total}"></td>

            <td>
                <span class="badge bg-success"
                      th:text="${r.estado}">
                </span>
            </td>

            <td>

                <a th:href="@{'/reservas/editar/' + ${r.id}}"
                   class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil-square"></i>

                    Editar

                </a>

                <a th:href="@{'/reservas/eliminar/' + ${r.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Está seguro de eliminar esta reserva?')">

                    <i class="bi bi-trash"></i>

                    Eliminar

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
