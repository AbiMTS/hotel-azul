<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Usuarios | Hotel Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            <i class="bi bi-people-fill"></i>

            Gestión de Usuarios

        </h2>

        <div>

            <a th:href="@{/dashboard}" class="btn btn-secondary me-2">

                <i class="bi bi-house-door-fill"></i>

                Inicio

            </a>

            <a th:href="@{/usuarios/nuevo}" class="btn btn-success">

                <i class="bi bi-plus-circle"></i>

                Nuevo Usuario

            </a>

        </div>

    </div>

    <table class="table table-bordered table-hover shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Correo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th width="180">Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="u : ${usuarios}">

            <td th:text="${u.id}"></td>

            <td th:text="${u.nombres}"></td>

            <td th:text="${u.apellidos}"></td>

            <td th:text="${u.correo}"></td>

            <td th:text="${u.rol.nombre}"></td>

            <td>
                <span class="badge bg-success"
                      th:text="${u.estado ? 'Activo' : 'Inactivo'}">
                </span>
            </td>

            <td>

                <a th:href="@{'/usuarios/editar/' + ${u.id}}"
                   class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil-square"></i>

                    Editar

                </a>

                <a th:href="@{'/usuarios/eliminar/' + ${u.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Desea eliminar este usuario?')">

                    <i class="bi bi-trash"></i>

                    Eliminar

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
