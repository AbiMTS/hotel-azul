<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Editar Huésped</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Editar Huésped</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/huespedes/guardar}"
                  th:object="${huesped}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label>Nombres</label>
                    <input type="text" class="form-control" th:field="*{nombres}">
                </div>

                <div class="mb-3">
                    <label>Apellidos</label>
                    <input type="text" class="form-control" th:field="*{apellidos}">
                </div>

                <div class="mb-3">
                    <label>DNI</label>
                    <input type="text" class="form-control" th:field="*{dni}">
                </div>

                <div class="mb-3">
                    <label>Teléfono</label>
                    <input type="text" class="form-control" th:field="*{telefono}">
                </div>

                <div class="mb-3">
                    <label>Correo</label>
                    <input type="email" class="form-control" th:field="*{correo}">
                </div>

                <div class="mb-3">
                    <label>Dirección</label>
                    <input type="text" class="form-control" th:field="*{direccion}">
                </div>

                <button class="btn btn-warning">
                    Actualizar
                </button>

                <a th:href="@{/huespedes}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
