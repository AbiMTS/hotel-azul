<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hotel Azul - Login</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login{
            width:360px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 0 25px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            color:#2563eb;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:12px;
            border:1px solid #ddd;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="login">

    <h2>Hotel Azul</h2>

    <form method="post" th:action="@{/login}">

        <input
                type="text"
                name="username"
                placeholder="Correo">

        <input
                type="password"
                name="password"
                placeholder="Contraseña">

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
