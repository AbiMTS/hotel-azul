<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <title>Editar Habitación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning">

            <h3>Editar Habitación</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/habitaciones/guardar}"
                  th:object="${habitacion}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Número</label>
                    <input type="text" class="form-control" th:field="*{numero}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Piso</label>
                    <input type="number" class="form-control" th:field="*{piso}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Precio</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{precio}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Tipo de Habitación</label>

                    <select class="form-select" th:field="*{tipoHabitacion.id}">

                        <option th:each="tipo : ${tiposHabitacion}"
                                th:value="${tipo.id}"
                                th:text="${tipo.nombre}">
                        </option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Estado</label>

                    <select class="form-select" th:field="*{estado}">
                        <option value="Disponible">Disponible</option>
                        <option value="Ocupada">Ocupada</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                    </select>

                </div>

                <button class="btn btn-warning">
                    Actualizar
                </button>

                <a th:href="@{/habitaciones}" class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
