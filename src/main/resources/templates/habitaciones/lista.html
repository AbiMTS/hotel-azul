<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Habitaciones | Hotel Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2>🛏 Gestión de Habitaciones</h2>
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">

            <span th:text="${mensaje}"></span>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert">
            </button>

        </div>
        <a th:href="@{/habitaciones/nueva}" class="btn btn-success">
            Nueva Habitación
        </a>
    </div>

    <table class="table table-hover table-bordered shadow">

        <thead class="table-primary">

        <tr>

            <th>ID</th>
            <th>Número</th>
            <th>Piso</th>
            <th>Precio</th>
            <th>Estado</th>
            <th>Tipo</th>
            <th width="180">Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="h : ${habitaciones}">

            <td th:text="${h.id}"></td>

            <td th:text="${h.numero}"></td>

            <td th:text="${h.piso}"></td>

            <td th:text="${h.precio}"></td>

            <td th:text="${h.estado}"></td>

            <td th:text="${h.tipoHabitacion.nombre}"></td>

            <td>
                <a th:href="@{'/habitaciones/editar/' + ${h.id}}"
                   class="btn btn-warning btn-sm">

                    Editar

                </a>

                <a th:href="@{'/habitaciones/eliminar/' + ${h.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Está seguro de eliminar esta habitación?')">

                    Eliminar

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
