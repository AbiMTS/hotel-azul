<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🛏 Gestión de Habitaciones</h2>
    <div>
        <a th:href="@{/dashboard}" class="btn btn-secondary me-2">
            <i class="bi bi-house-door-fill"></i>
            Inicio
        </a>
        <a th:href="@{/habitaciones/nueva}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i>
            Nueva Habitación
        </a>
    </div>
</div>
<div th:if="${mensaje}"
     class="alert alert-success alert-dismissible fade show"
     role="alert">
    <span th:text="${mensaje}"></span>
    <button type="button"
            class="btn-close"
            data-bs-dismiss="alert">
    </button>
</div>
<form th:action="@{/habitaciones}"
      method="get"
      class="row mb-4">
    <div class="col-md-6">
        <input type="text"
               name="buscar"
               th:value="${buscar}"
               class="form-control"
               placeholder="Buscar por número de habitación">
    </div>
    <div class="col-md-3">
        <button type="submit"
                class="btn btn-primary">
            <i class="bi bi-search"></i>
            Buscar
        </button>
        <a th:href="@{/habitaciones}"
           class="btn btn-secondary">
            Limpiar
        </a>
    </div>
</form>
<table class="table table-hover table-bordered shadow">
    <thead class="table-primary">
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Piso</th>
        <th>Precio</th>
        <th>Estado</th>
        <th>Tipo</th>
        <th width="180">Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="h : ${habitaciones}">

        <td th:text="${h.id}"></td>

        <td th:text="${h.numero}"></td>

        <td th:text="${h.piso}"></td>

        <td th:text="${h.precio}"></td>

        <td th:text="${h.estado}"></td>

        <td th:text="${h.tipoHabitacion.nombre}"></td>
        <td>
            <a th:href="@{'/habitaciones/editar/' + ${h.id}}"
               class="btn btn-warning btn-sm">

                <i class="bi bi-pencil-square"></i>
                Editar
            </a>
            <a th:href="@{'/habitaciones/eliminar/' + ${h.id}}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Está seguro de eliminar esta habitación?')">
                <i class="bi bi-trash"></i>
                Eliminar
            </a>
        </td>
    </tr>
    </tbody>
</table>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
