<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Pagos | Hotel Azul</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-cash-coin"></i>
            Gestión de Pagos
        </h2>

        <div>

            <a th:href="@{/dashboard}" class="btn btn-secondary me-2">
                <i class="bi bi-house-door-fill"></i>
                Inicio
            </a>

            <a th:href="@{/pagos/nuevo}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i>
                Nuevo Pago
            </a>

        </div>

    </div>
    <form th:action="@{/pagos}"
          method="get"
          class="row mb-4">

        <div class="col-md-6">

            <input type="text"
                   name="buscar"
                   th:value="${buscar}"
                   class="form-control"
                   placeholder="Buscar por método de pago o ID de reserva">

        </div>
        <div class="col-md-3">
            <button type="submit"
                    class="btn btn-primary">

                <i class="bi bi-search"></i>
                Buscar
            </button>
            <a th:href="@{/pagos}"
               class="btn btn-secondary">

                Limpiar
            </a>
        </div>

    </form>
    <table class="table table-bordered table-hover shadow">

        <thead class="table-success">

        <tr>

            <th>ID</th>
            <th>Reserva</th>
            <th>Fecha Pago</th>
            <th>Monto</th>
            <th>Método</th>
            <th width="180">Acciones</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="p : ${pagos}">

            <td th:text="${p.id}"></td>

            <td th:text="${p.reserva.id}"></td>

            <td th:text="${p.fechaPago}"></td>

            <td th:text="${p.monto}"></td>

            <td th:text="${p.metodoPago}"></td>

            <td>

                <a th:href="@{'/pagos/editar/' + ${p.id}}"
                   class="btn btn-warning btn-sm">

                    <i class="bi bi-pencil-square"></i>

                    Editar

                </a>

                <a th:href="@{'/pagos/eliminar/' + ${p.id}}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('¿Eliminar este pago?')">

                    <i class="bi bi-trash"></i>

                    Eliminar

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
